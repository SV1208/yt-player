<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTube</title>
<style>
  :root { color-scheme: light dark; --line: rgba(128,128,128,.3); --hi: rgba(128,128,128,.2); }
  body { font: 16px system-ui, sans-serif; max-width: 1200px; margin: 0 auto; padding: 16px; }
  input { width: 100%; padding: 12px; font: inherit; box-sizing: border-box; }
  #msg { margin: 8px 0 0; font-size: 14px; opacity: .85; }
  #msg:empty { display: none; }

  #wrap { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 12px; }
  #wrap.has-list { grid-template-columns: 1fr 340px; }
  #player { position: relative; aspect-ratio: 16 / 9; background: #000; width: 100%; }
  #player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  #listbox { position: relative; border: 1px solid var(--line); border-radius: 8px; display: none; }
  #wrap.has-list #listbox { display: block; }
  #list { position: absolute; inset: 0; overflow-y: auto; margin: 0; padding: 4px; list-style: none; }
  #list li { display: flex; gap: 8px; padding: 6px; border-radius: 6px; cursor: pointer; align-items: center; }
  #list li:hover, #list li.on { background: var(--hi); }
  #list li.on { font-weight: 600; }
  #list .n { width: 22px; text-align: center; font-size: 12px; opacity: .6; flex: none; }
  #list img { width: 96px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 4px; flex: none; background: #000; }
  #list .t { font-size: 14px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }

  @media (max-width: 800px) {
    #wrap.has-list { grid-template-columns: 1fr; }
    #listbox { height: 360px; }
  }
</style>
</head>
<body>
<input id="u" type="text" placeholder="Paste YouTube video or playlist link" autocomplete="off" autofocus>
<p id="msg"></p>
<div id="wrap">
  <div id="player"></div>
  <div id="listbox"><ul id="list"></ul></div>
</div>

<script>
const $ = id => document.getElementById(id);
const u = $('u'), msg = $('msg'), wrap = $('wrap'), box = $('player'), listEl = $('list');

let player = null, apiReady = false, req = null, built = false, ids = [], timer = null;

// YouTube IFrame API is only used to read the playlist; the plain embed plays either way
window.onYouTubeIframeAPIReady = () => { apiReady = true; if (req) attach(); };
const s = document.createElement('script');
s.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(s);

function parse() {
  const v = u.value.trim();
  const raw = (v.match(/[?&]list=([\w-]+)/) || v.match(/^((?:PL|UU|FL|OL|LL)[\w-]{10,})$/) || [])[1];
  // Only real playlists can be embedded; YouTube "Mix" (RD...) and Watch Later (WL) lists can't
  const list = /^(PL|UU|FL|OL)[\w-]{10,}$/.test(raw || '') ? raw : undefined;
  const vid = (v.match(/(?:[?&]v=|youtu\.be\/|shorts\/|live\/|embed\/)([\w-]{11})/) || v.match(/^([\w-]{11})$/) || [])[1];
  const tm = v.match(/[?&](?:t|start)=(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?(?:&|#|$)/);
  const t = tm ? (+tm[1] || 0) * 3600 + (+tm[2] || 0) * 60 + (+tm[3] || 0) : 0;
  return (list || vid || raw) ? { list, vid, t, mix: !!raw && !list } : null;
}

function reset() {
  clearTimeout(timer);
  if (player) { try { player.destroy(); } catch (e) {} player = null; }
  box.innerHTML = ''; listEl.innerHTML = '';
  wrap.classList.remove('has-list');
  msg.textContent = ''; built = false; ids = []; req = null;
}

function play() {
  const r = parse();
  reset();
  if (!r) return;
  if (!r.list && !r.vid) { msg.textContent = "This is a YouTube Mix or Watch Later list, which can't be played here. Paste a video or a regular playlist link."; return; }
  req = r;

  const q = new URLSearchParams({ autoplay: 1, rel: 0, playsinline: 1, enablejsapi: 1 });
  if (location.origin.startsWith('http')) q.set('origin', location.origin);
  if (r.list) q.set('list', r.list);
  if (r.t && !r.list) q.set('start', r.t);

  box.innerHTML = `<iframe id="yt" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"
    allow="autoplay; picture-in-picture; fullscreen; encrypted-media"
    src="https://www.youtube-nocookie.com/embed/${r.list && !r.vid ? 'videoseries' : r.vid}?${q}"></iframe>`;

  if (r.list) {
    // If the side list can't be built, say so (video still plays)
    timer = setTimeout(() => {
      if (!built) msg.textContent = "Playlist list couldn't load here, but the video still plays and moves on to the next one.";
    }, 10000);
    if (apiReady) attach();
  }
}

function attach() {
  const mine = req;
  player = new YT.Player('yt', {
    events: {
      onReady: () => tryBuild(),
      onStateChange: () => { tryBuild(); highlight(); },
      onError: e => { if (mine === req) msg.textContent = `YouTube can't play this here (error ${e.data}). It may be private, unavailable, or have embedding turned off.`; }
    }
  });
}

function tryBuild() {
  if (built || !player || !player.getPlaylist) return;
  const arr = player.getPlaylist();
  if (!arr || !arr.length) return;
  built = true; ids = arr; msg.textContent = '';
  wrap.classList.add('has-list');
  listEl.innerHTML = arr.map((id, i) => `
    <li data-i="${i}">
      <span class="n">${i + 1}</span>
      <img loading="lazy" src="https://i.ytimg.com/vi/${id}/mqdefault.jpg" alt="">
      <span class="t">Video ${i + 1}</span>
    </li>`).join('');
  loadTitles();
  highlight();
}

listEl.addEventListener('click', e => {
  const li = e.target.closest('li');
  if (li && player) player.playVideoAt(+li.dataset.i);
});

function highlight() {
  if (!built || !player || !player.getPlaylistIndex) return;
  const i = player.getPlaylistIndex();
  const cur = listEl.querySelector('.on');
  if (cur && +cur.dataset.i === i) return;
  if (cur) cur.classList.remove('on');
  const li = listEl.children[i];
  if (!li) return;
  li.classList.add('on');
  listEl.scrollTop = li.offsetTop - listEl.clientHeight / 2 + li.clientHeight / 2;
}

// Titles are best effort; entries keep "Video N" if the lookup is blocked
async function loadTitles() {
  const mine = ids, queue = mine.map((id, i) => [id, i]);
  const worker = async () => {
    while (queue.length && mine === ids) {
      const [id, i] = queue.shift();
      try {
        const r = await fetch('https://www.youtube.com/oembed?format=json&url=' +
          encodeURIComponent('https://www.youtube.com/watch?v=' + id));
        if (!r.ok) continue;
        const d = await r.json();
        const el = listEl.children[i] && listEl.children[i].querySelector('.t');
        if (el && mine === ids) el.textContent = d.title;
      } catch (e) {}
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
}

u.addEventListener('input', play);
u.addEventListener('keydown', e => e.key === 'Enter' && play());

const q = new URLSearchParams(location.search).get('yt');
if (q) { u.value = q; play(); }
</script>
</body>
</html>
