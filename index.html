<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTube</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 16px; }
  input { width: 100%; padding: 12px; font: inherit; box-sizing: border-box; }
  iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; margin-top: 12px; }
</style>
</head>
<body>
<input id="u" type="text" placeholder="Paste YouTube link or ID" autocomplete="off" autofocus>
<div id="p"></div>
<script>
const u = document.getElementById('u'), p = document.getElementById('p');

function play() {
  const m = u.value.match(/(?:v=|youtu\.be\/|shorts\/|live\/|embed\/)([\w-]{11})/)
         || u.value.trim().match(/^([\w-]{11})$/);
  if (!m) { p.innerHTML = ''; return; }
  const t = (u.value.match(/[?&](?:t|start)=(\d+)/) || [])[1];
  p.innerHTML = `<iframe allowfullscreen referrerpolicy="strict-origin-when-cross-origin"
    allow="autoplay; picture-in-picture; fullscreen; encrypted-media"
    src="https://www.youtube-nocookie.com/embed/${m[1]}?autoplay=1&rel=0${t ? '&start=' + t : ''}"></iframe>`;
}

u.addEventListener('input', play);
u.addEventListener('keydown', e => e.key === 'Enter' && play());

const q = new URLSearchParams(location.search).get('yt');
if (q) { u.value = q; play(); }
</script>
</body>
</html>
