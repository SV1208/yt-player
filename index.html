<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTube</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 16px; }
  input { width: 100%; padding: 12px; font: inherit; box-sizing: border-box; }
  iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; margin-top: 12px; }
</style>
</head>
<body>
<input id="u" type="text" placeholder="Paste YouTube video or playlist link" autocomplete="off" autofocus>
<div id="p"></div>
<script>
const u = document.getElementById('u'), p = document.getElementById('p');

function play() {
  const s = u.value.trim();

  // Playlist ID: from ?list=... or a bare playlist ID
  const list = (s.match(/[?&]list=([\w-]+)/) || s.match(/^((?:PL|UU|FL|OL|LL)[\w-]{10,})$/) || [])[1];

  // Video ID: watch?v=, youtu.be/, shorts/, live/, embed/ or a bare 11-char ID
  const vid = (s.match(/(?:[?&]v=|youtu\.be\/|shorts\/|live\/|embed\/)([\w-]{11})/) || s.match(/^([\w-]{11})$/) || [])[1];

  if (!list && !vid) { p.innerHTML = ''; return; }

  const t = (s.match(/[?&](?:t|start)=(\d+)/) || [])[1];
  const params = new URLSearchParams({ autoplay: 1, rel: 0 });
  if (list) params.set('list', list);
  if (t && !list) params.set('start', t);

  // Playlist only -> "videoseries"; video inside a playlist -> start at that video
  const path = vid ? vid : 'videoseries';

  p.innerHTML = `<iframe allowfullscreen referrerpolicy="strict-origin-when-cross-origin"
    allow="autoplay; picture-in-picture; fullscreen; encrypted-media"
    src="https://www.youtube-nocookie.com/embed/${path}?${params}"></iframe>`;
}

u.addEventListener('input', play);
u.addEventListener('keydown', e => e.key === 'Enter' && play());

const q = new URLSearchParams(location.search).get('yt');
if (q) { u.value = q; play(); }
</script>
</body>
</html>
